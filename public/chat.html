<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat | PsicoConnect</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <a class="logo" href="index.html">PsicoConnect</a>
    <nav class="nav">
      <a href="index.html">Início</a>
      <a data-session-label href="login.html">Painel</a>
      <a data-logout href="#">Sair</a>
    </nav>
  </header>

  <main class="page-content chat-layout" id="painelChat">
    <section class="chat-box">
      <h1 id="chatTitulo">Chat da consulta</h1>
      <p id="chatInfo" class="muted"></p>
      <div id="chatMensagens" class="chat-messages"></div>
      <form id="formChat" class="chat-form">
        <textarea id="textoChat" rows="3" placeholder="Escreva sua mensagem"></textarea>
        <button class="btn-primary" type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <footer class="footer"><p>© 2026 PsicoConnect</p></footer>
  <script src="js/script.js"></script>
</body>
</html>
