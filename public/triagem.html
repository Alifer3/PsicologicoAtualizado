<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Triagem Inteligente | PsicoConnect</title><link rel="stylesheet" href="css/style.css" /></head><body>
<header class="header"><a class="logo" href="index.html">PsicoConnect</a></header>
<main class="page-content narrow"><section class="page-hero compact"><h1>Triagem Inteligente</h1></section>
<form class="form-card wide-form">
<h3>Dados Pessoais</h3>
<input placeholder="Nome completo"><input type="number" placeholder="Idade">
<input placeholder="Profissão"><input placeholder="Estado civil">

<h3>Motivo da Consulta</h3>
<textarea rows="4" placeholder="Descreva o motivo principal"></textarea>

<h3>Escala de Sintomas (0-10)</h3>
<label>Ansiedade</label><input type="range" min="0" max="10">
<label>Tristeza</label><input type="range" min="0" max="10">
<label>Estresse</label><input type="range" min="0" max="10">

<h3>Histórico de Saúde Mental</h3>
<label><input type="checkbox"> Já fez terapia</label>
<label><input type="checkbox"> Usa medicamentos</label>
<label><input type="checkbox"> Acompanhamento psiquiátrico</label>

<h3>Avaliação de Risco</h3>
<label><input type="checkbox"> Pensamentos suicidas</label>
<label><input type="checkbox"> Automutilação</label>
<label><input type="checkbox"> Situação de violência</label>

<button class="btn-primary">Salvar Triagem</button>
</form></main></body></html>
