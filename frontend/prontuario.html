<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Prontuário | PsicoConnect</title><link rel="stylesheet" href="css/style.css" /></head><body>
<header class="header"><a class="logo" href="index.html">PsicoConnect</a></header>
<main class="page-content narrow"><form class="form-card wide-form">
<h2>Prontuário Psicológico Completo</h2>

<label>Queixa Principal</label><textarea rows="3"></textarea>
<label>Histórico Resumido</label><textarea rows="4"></textarea>

<h3>Estado Mental</h3>
<input placeholder="Humor">
<input placeholder="Afeto">
<input placeholder="Linguagem">

<label>Evolução da Sessão</label><textarea rows="5"></textarea>

<label>Técnicas Utilizadas</label>
<textarea rows="2" placeholder="TCC, Psicoeducação, Mindfulness..."></textarea>

<label>Hipóteses Clínicas</label><textarea rows="3"></textarea>

<label>Plano Terapêutico</label><textarea rows="3"></textarea>

<label>Condutas e Encaminhamentos</label><textarea rows="3"></textarea>

<label>Tarefas para Casa</label><textarea rows="3"></textarea>

<label>Avaliação de Risco</label><textarea rows="2"></textarea>

<button class="btn-primary">Salvar Prontuário</button>
</form></main></body></html>
