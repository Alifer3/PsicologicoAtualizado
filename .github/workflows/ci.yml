name: "PsicoConnect CI-CD"

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

env:
  NODE_ENV: "test"
  JWT_SECRET: "ci_test_secret_32_characters_minimum_psicoconnect_key"
  PAYMENT_PROVIDER: "mock"
  GOOGLE_MEET_PROVIDER: "mock"

jobs:
  backend-tests:
    name: "Backend - Testes e Seguranca"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: psicoconnect
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: psicoconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgres://psicoconnect:testpassword@localhost:5432/psicoconnect_test"

    steps:
      - name: "Checkout do codigo"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: "Instalar dependencias"
        working-directory: ./backend
        run: npm ci --ignore-scripts || npm install

      - name: "Preparar banco de dados PostgreSQL"
        run: |
          psql "$DATABASE_URL" -f database/schema.sql
          psql "$DATABASE_URL" -f database/seed.sql

      - name: "Testes de Seguranca: IDOR"
        working-directory: ./backend
        run: node --test "src/__tests__/security.idor.test.js"

      - name: "Testes de Seguranca: Criptografia e Senhas"
        working-directory: ./backend
        run: node --test "src/__tests__/security.crypto.test.js"

      - name: "Testes de Seguranca: Injecao de Codigo"
        working-directory: ./backend
        run: node --test "src/__tests__/security.injection.test.js"

      - name: "Testes de Seguranca: Protecao Contra Bots"
        working-directory: ./backend
        run: node --test "src/__tests__/security.bots.test.js"

      - name: "Executar Bateria Completa de Testes"
        working-directory: ./backend
        run: npm test

      - name: "Verificar inicializacao do servidor"
        working-directory: ./backend
        run: |
          timeout 10 node src/server.js &
          sleep 3
          curl -f http://localhost:3000/api/health || exit 1
          echo "Servidor iniciou com sucesso!"
          kill %1 2>/dev/null || true
        env:
          NODE_ENV: development
          DATABASE_URL: "postgres://psicoconnect:testpassword@localhost:5432/psicoconnect_test"

  frontend-validation:
    name: "Frontend - Validacao HTML"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout do codigo"
        uses: actions/checkout@v4

      - name: "Verificar arquivos HTML existem"
        run: |
          for file in index.html login.html cadastro.html cadastro-psicologo.html \
                      psicologos.html perfil.html agendamento.html planos.html \
                      dashboard-paciente.html dashboard-psicologo.html admin.html \
                      chat.html triagem.html emergencia.html prontuario.html \
                      contato.html sobre.html; do
            if [ -f "frontend/$file" ]; then
              echo "OK: $file"
            else
              echo "FALTANDO: $file"
              exit 1
            fi
          done

      - name: "Verificar CSS e JS existem"
        run: |
          test -f frontend/css/style.css
          test -f frontend/js/script.js

  database-validation:
    name: "Database - Validacao SQL"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: psicoconnect
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: psicoconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "Checkout do codigo"
        uses: actions/checkout@v4

      - name: "Executar schema.sql"
        run: |
          psql "postgres://psicoconnect:testpassword@localhost:5432/psicoconnect_test" -f database/schema.sql

      - name: "Executar seed.sql"
        run: |
          psql "postgres://psicoconnect:testpassword@localhost:5432/psicoconnect_test" -f database/seed.sql

      - name: "Verificar tabelas criadas"
        run: |
          TABLES=$(psql "postgres://psicoconnect:testpassword@localhost:5432/psicoconnect_test" -t -c "SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename;")
          for table in usuarios pacientes psicologos enderecos planos assinaturas agendamentos triagens prontuarios mensagens; do
            if echo "$TABLES" | grep -q "$table"; then
              echo "Tabela OK: $table"
            else
              echo "Tabela ausente: $table"
              exit 1
            fi
          done

  security-check:
    name: "Seguranca - Auditoria de Credenciais"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout do codigo"
        uses: actions/checkout@v4

      - name: "Verificar ausencia de arquivo .env"
        run: |
          if [ -f "backend/.env" ]; then
            echo "ERRO: arquivo .env encontrado no repositorio!"
            exit 1
          fi

      - name: "Verificar que nao ha chaves hardcoded"
        run: |
          FOUND=0
          if grep -rn "sk_live_" backend/ frontend/ 2>/dev/null; then
            echo "Chave Stripe de producao encontrada!"
            FOUND=1
          fi
          if grep -rn "APP_USR-" backend/ frontend/ 2>/dev/null; then
            echo "Token Mercado Pago encontrado!"
            FOUND=1
          fi
          if grep -rn "BEGIN PRIVATE KEY" backend/src/ frontend/ 2>/dev/null; then
            echo "Chave privada encontrada no codigo!"
            FOUND=1
          fi
          if [ $FOUND -eq 1 ]; then
            exit 1
          fi

      - name: "Verificar .gitignore"
        run: |
          for pattern in ".env" "node_modules/" "*.log"; do
            if grep -q "$pattern" .gitignore; then
              echo "gitignore OK: $pattern"
            else
              echo "gitignore falta: $pattern"
              exit 1
            fi
          done

  deploy-vercel:
    name: "Deploy - Vercel Production"
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-validation, database-validation, security-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: "Checkout do codigo"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "Deploy na Vercel"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Aviso: VERCEL_TOKEN nao configurado nos Secrets do repositorio."
            echo "O projeto ja possui vercel.json e api/index.js configurados e prontos para deploy."
            exit 0
          fi

          npm install --global vercel@latest
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          echo "Deploy concluido com sucesso: $DEPLOY_URL"
